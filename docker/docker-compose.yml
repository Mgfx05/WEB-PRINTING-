services:
  # ============================================================
  # PostgreSQL 16
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: erb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erb_user
      POSTGRES_PASSWORD: erb_password
      POSTGRES_DB: erb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erb_user -d erb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis 7 (BullMQ queue backend)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: erb_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass erb_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "erb_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # pgAdmin (optional dev tool)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erb_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erb.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  # ============================================================
  # Redis Commander (optional dev tool)
  # ============================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: erb_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:erb_redis_password"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
